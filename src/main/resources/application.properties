# ============================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================
server.port=8080
server.servlet.context-path=/api

# ============================================
# CONFIGURACIÓN DE LA BASE DE DATOS
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/repara_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
# IMPORTANTE: validate SOLO si las tablas ya existen en MySQL
# Si vas a dejar que Hibernate cree las tablas, usa 'update'
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT
# ============================================
jwt.secreto=ReparaClaveSecretaSuperSeguraParaJWT2026CambiarEnProduccionMinimo256Bits
jwt.expiracion=86400000
jwt.refresh.expiracion=604800000

# ============================================
# GEMINI IA (reemplaza TU_API_KEY_AQUI por tu key real)
# ============================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# ============================================
# ARCHIVOS / UPLOADS
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
archivos.directorio=uploads/

# ============================================
# LOGS
# ============================================
logging.level.com.repara.entidades=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# SWAGGER
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================
# JACKSON - Formato de fechas
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima

# ============================================
# JPA - Deshabilitar advertencia de Open Session in View
# ============================================
spring.jpa.open-in-view=false
# ============================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================
server.port=${PORT:8080}
server.servlet.context-path=/api

# ============================================
# CONFIGURACIÓN DE LA BASE DE DATOS (AIVEN)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# JWT
# ============================================
jwt.secreto=${JWT_SECRETO:ReparaClaveSecretaSuperSeguraParaJWT2026CambiarEnProduccionMinimo256Bits}
jwt.expiracion=86400000
jwt.refresh.expiracion=604800000

# ============================================
# GEMINI IA
# ============================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# ============================================
# ARCHIVOS / UPLOADS
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
archivos.directorio=uploads/

# ============================================
# LOGS
# ============================================
logging.level.com.repara.entidades=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# ============================================
# SWAGGER
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================
# JACKSON
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima

# ============================================
# JPA
# ============================================
spring.jpa.open-in-view=false

# ============================================
# BACKUPS (desactivado en prod - Render no tiene mysqldump)
# ============================================
backup.directory.path=./backups
backup.max.files=30
backup.mysqldump.path=
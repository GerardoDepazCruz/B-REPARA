# ============================================
# PERFIL ACTIVO Y VARIABLES DE ENTORNO
# ============================================
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

# ============================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================
server.port=${PORT:8080}
server.servlet.context-path=/api

# ============================================
# CONFIGURACIÓN DE LA BASE DE DATOS (AIVEN)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================
# JWT Y GEMINI
# ============================================
jwt.secreto=${JWT_SECRETO:ReparaClaveSecretaSuperSeguraParaJWT2026CambiarEnProduccionMinimo256Bits}
jwt.expiracion=86400000
gemini.api.key=${GEMINI_API_KEY:TU_API_KEY_AQUI}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# ============================================
# OTROS (ARCHIVOS Y LOGS)
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
archivos.directorio=uploads/
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs